services:
  - type: web
    name: gys-portal
    env: python
    plan: free
    
    # Build setup
    buildCommand: npm install && npm run build && pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT
    
    # Environment variables
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
