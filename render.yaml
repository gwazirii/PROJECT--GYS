services:
  - type: web
    name: gys-portal
    runtime: python
    plan: free

    buildCommand: npm install && npm run build && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        value: "change-me-in-render"
