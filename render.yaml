services:
  - type: web
    name: gys-portal
    runtime: python
    plan: free

    buildCommand: npm install && npm run build && pip install -r requirements.txt
    startCommand: gunicorn --chdir backend wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: SECRET_KEY
        sync: false
