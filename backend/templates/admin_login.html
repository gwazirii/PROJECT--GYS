<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>GYS Command Central</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:linear-gradient(180deg,#071018,#0b1f24);color:#e6f7f2;font-family:'Segoe UI',Arial,sans-serif} .card{border-radius:10px}</style>
</head>
<body>
    <main style="max-width:520px;margin:56px auto;">
        <div class="card p-4 shadow-sm">
            <div class="text-center mb-3">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="GYS Logo" style="max-height:80px;" onerror="this.style.display='none'">
                <h2 class="mt-3">GYS Command Central</h2>
                <div class="text-muted">Authorized Board Member Access</div>
            </div>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert alert-warning">{{ messages[0] }}</div>
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('trustee_login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Username / Board Member ID</label>
                    <input name="trustee_username" class="form-control" required>
                </div>
                <div class="mb-3 position-relative">
                    <label class="form-label">Password</label>
                    <input name="password" id="adminPw" type="password" class="form-control" required>
                    <button type="button" id="toggleAdminPw" class="btn btn-sm btn-outline-secondary" style="position:absolute; right:8px; top:34px;">Show</button>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <a href="/" class="small">← Back to Main Website</a>
                    <button class="btn btn-primary" type="submit">Sign In</button>
                </div>
            </form>
        </div>
    </main>
    <script>
        document.getElementById('toggleAdminPw').addEventListener('click', function(){
            var pw = document.getElementById('adminPw');
            if(pw.type==='password'){ pw.type='text'; this.textContent='Hide'; } else { pw.type='password'; this.textContent='Show'; }
        });
    </script>
</body>
</html>
