<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Campaign Participant Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; font-family: 'Segoe UI', Arial, sans-serif; }
        .login-shell { max-width: 420px; margin: 48px auto; }
        .card { border-radius: 10px; }
        .brand { text-align: center; margin-bottom: 12px; }
        .brand img { max-height: 72px; }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="brand text-center">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="GYS Logo" onerror="this.style.display='none'">
                    <h4 class="mt-2">GYS Youth Supporters</h4>
                    <div class="text-muted small">Sign in to your personal dashboard.</div>
                </div>

                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    <div class="alert alert-warning">{{ messages[0] }}</div>
                  {% endif %}
                {% endwith %}

                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input name="username" class="form-control" autocomplete="username" required minlength="3">
                    </div>
                    <div class="mb-3 position-relative">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" id="loginPassword" class="form-control" autocomplete="current-password" required>
                        <button type="button" id="toggleLoginPw" class="btn btn-sm btn-outline-secondary" style="position:absolute;right:8px;top:34px;">Show</button>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <a href="#" class="small">Forgot Password?</a>
                        <button class="btn btn-success" type="submit">Sign In</button>
                    </div>
                    <div class="text-center small">
                        Don't have an account? <a href="{{ url_for('gate') }}">Register</a>
                    </div>
                </form>

                <script>
                    document.getElementById('toggleLoginPw').addEventListener('click', function(){
                        var pw = document.getElementById('loginPassword');
                        if(pw.type === 'password'){ pw.type = 'text'; this.textContent = 'Hide'; }
                        else { pw.type = 'password'; this.textContent = 'Show'; }
                    });
                </script>
            </div>
        </div>
    </main>
</body>
</html>
